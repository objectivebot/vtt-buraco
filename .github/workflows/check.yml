name: Validate and publish Buraco
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# Avoid concurrent jobs replacing the same rolling main release.
concurrency:
  group: buraco-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref != 'refs/tags/main-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm run check
      - run: unzip -t dist/buraco.vtt && unzip -t dist/m0-probe.vtt
      - uses: actions/checkout@v4
        with:
          repository: ArnoldSmith86/virtualtabletop
          path: upstream-vtt
          persist-credentials: false
      - run: npm ci --ignore-scripts
        working-directory: upstream-vtt
      - run: node upstream-vtt/validator/validate_gamefile_node.js dist/buraco.json
      - run: node upstream-vtt/validator/validate_gamefile_node.js dist/m0-probe.json
      - name: Load ZIP through VirtualTabletop server importer
        working-directory: upstream-vtt
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import FileLoader from "./server/fileloader.mjs";
            const states = await FileLoader.readStatesFromBuffer(fs.readFileSync("../dist/buraco.vtt"));
            if (states.VTT?.[0]?._meta?.info?.name !== "Buraco (manual table)")
              throw Error("VTT importer rejected Buraco state");
            console.log("VirtualTabletop importer accepted", Object.keys(states.VTT[0]).length, "state entries");
            const probe = await FileLoader.readStatesFromBuffer(fs.readFileSync("../dist/m0-probe.vtt"));
            if (probe.VTT?.[0]?._meta?.info?.name !== "Buraco M0 — event and rollback probe")
              throw Error("M0 probe importer rejected test state");
          '
      - name: Simulate upload into a real VirtualTabletop room
        working-directory: upstream-vtt
        run: node ../tests/upstream-room-integration.mjs
      - name: M0 two simulated clients, unauthorized delta, disk persistence and reload
        working-directory: upstream-vtt
        run: node ../tests/upstream-m0-integration.mjs
      - name: M0 real-browser two-client smoke
        working-directory: upstream-vtt
        timeout-minutes: 6
        run: |
          cp ../tests/testcafe/m0.js tests/testcafe/buraco-m0.js
          node server.mjs > ../m0-vtt-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8272/testcafe-testing >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://localhost:8272/testcafe-testing >/dev/null; then
            cat ../m0-vtt-server.log
            exit 1
          fi
          if ! ./node_modules/.bin/testcafe chrome:headless --disable-native-automation tests/testcafe/buraco-m0.js; then
            cat ../m0-vtt-server.log
            exit 1
          fi
      - name: Publish rolling main prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The stable main-build release URL always serves the latest validated
          # archive. Do not force-update an existing release tag: GITHUB_TOKEN
          # may be unable to move it on protected repositories.
          if gh release view main-build >/dev/null 2>&1; then
            gh release edit main-build --title "main (latest)" --prerelease \
              --notes "Latest validated Buraco build from the main branch (commit $GITHUB_SHA)."
            gh release upload main-build dist/buraco.vtt dist/m0-probe.vtt --clobber
          else
            gh release create main-build dist/buraco.vtt dist/m0-probe.vtt --target main --prerelease \
              --title "main (latest)" \
              --notes "Latest validated Buraco build from the main branch (commit $GITHUB_SHA)."
          fi
      - name: Publish versioned release for pushed tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/buraco.vtt dist/m0-probe.vtt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/buraco.vtt dist/m0-probe.vtt \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
